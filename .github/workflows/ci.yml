name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, imagick
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Syntax check
        run: composer lint

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, imagick
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: PHPUnit
        run: vendor/bin/phpunit
        env:
          SNAPSHOT_FAILURES_DIR: ${{ runner.temp }}/snapshots

      - name: Upload renders that did not match their snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures-php${{ matrix.php }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

  analyse:
    name: Coding standard & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, gd, imagick
          coverage: none
          tools: cs2pr

      - uses: ramsey/composer-install@v4

      - name: PHPCS (PSR-12 + PHPCompatibility 8.1+)
        run: vendor/bin/phpcs -q --report-checkstyle=${{ runner.temp }}/phpcs-report.xml --report-full

      - name: Annotate PHPCS results
        if: ${{ always() }}
        run: test -f "${{ runner.temp }}/phpcs-report.xml" && cs2pr --graceful-warnings "${{ runner.temp }}/phpcs-report.xml" || true

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  docker:
    name: Docker example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # As the README says: data/ belongs to www-data (uid 33) in the php image.
      - name: Prepare data/
        run: sudo chown -R 33:33 data

      - name: Build and start
        run: docker compose -f compose.yaml -f docker/compose.ci.yaml up -d --build

      - name: Check the PHP extensions
        run: |
          docker compose exec -T php php -r '
            $gd = gd_info();
            foreach (["JPEG Support", "FreeType Support", "WebP Support", "PNG Support"] as $f) {
                if (empty($gd[$f])) { fwrite(STDERR, "gd: no $f\n"); exit(1); }
            }
            foreach (["curl", "imagick"] as $e) {
                if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); }
            }
            echo "gd ", $gd["GD Version"], ", ", Imagick::getVersion()["versionString"], "\n";'

      - name: Render maps through nginx and PHP-FPM
        run: |
          map='http://localhost:8080/?width=300&height=200&zoom=3&latitude=40&longitude=-100'
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -sf -o home.html http://localhost:8080/ && grep -q 'id="demo-examples"' home.html
          curl -sf -o map.png "$map" && file map.png | grep -q 'PNG image data, 300 x 200'
          # A curved path (Imagick) as JPEG.
          curl -sfg -o map.jpg "$map&format=jpg&path[]=[-120,40],[-80,30]&bezier=30" && file map.jpg | grep -q 'JPEG image data'
          curl -sf http://localhost:8080/api/v1/ | grep -q '"api_version"'
          curl -sf -o /dev/null http://localhost:8080/images/dot-large-red.png
          # The second request comes from nginx's cache.
          curl -sf -D - -o /dev/null "$map" | grep -qi '^X-Cache-Status: HIT'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/?latitude=1')" = 400

      - name: Run the scripts as www-data
        run: |
          docker compose exec -T prune php bin/clients.php add ci-client
          docker compose exec -T prune php bin/prune-cache.php --dry-run

      - name: Logs
        if: ${{ always() }}
        run: docker compose -f compose.yaml -f docker/compose.ci.yaml logs

      - name: Stop
        if: ${{ always() }}
        run: docker compose -f compose.yaml -f docker/compose.ci.yaml down -v
