# nginx virtual host for the Docker example (#103): the README's virtual host
# and its optional cache of rendered maps, with PHP in the `php` service.

# Up to 1 GB of rendered maps, dropped after 7 days unused (see the README,
# "Cache rendered maps in nginx"). nginx follows the service's Cache-Control:
# private and no-store responses are not kept.
fastcgi_cache_path /var/cache/nginx/static-maps levels=1:2 keys_zone=static_maps:10m
                   max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /app/public;

    # Everything that isn't a file in public/ (maps, /api/, the home page) goes to PHP.
    try_files $uri /index.php?$args;

    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        fastcgi_pass            php:9000;
        fastcgi_index           index.php;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache           static_maps;
        fastcgi_cache_key       "$request_method$host$request_uri";
        fastcgi_cache_lock      on;
        fastcgi_cache_use_stale error timeout updating;
        add_header              X-Cache-Status $upstream_cache_status;
    }
}
